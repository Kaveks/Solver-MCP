name: Build and Deploy

# Triggers
# ─────────────────────────────────────────────────────────────────────
# Push to main              → full build, push image, update K8s repo
# Pull request to main      → build and test only, no push, no deploy
# Manual trigger            → full pipeline with optional image tag override

on:
  push:
    branches:
      - main
    paths-ignore:
      - "**.md"
      - "docs/**"
  pull_request:
    branches:
      - main
  workflow_dispatch:
    inputs:
      image_tag:
        description: "Override image tag (default: git SHA)"
        required: false
        default: ""

# Prevent concurrent deployments to the same environment
concurrency:
  group: deploy-${{ github.ref }}
  cancel-in-progress: true

env:
  # Docker registry — GitHub Container Registry
  REGISTRY: ghcr.io
  # Image name — matches the GitHub repo owner/name in lowercase
  IMAGE_NAME: ${{ github.repository_owner }}/Solver-MCP-mcp

jobs:
  # ════════════════════════════════════════════════════════════════════
  # Job 1: Test
  # Runs on every push and PR. Does not require Docker.
  # ════════════════════════════════════════════════════════════════════
  test:
    name: Run unit tests
    runs-on: ubuntu-latest

    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"

      - name: Install dependencies
        run: pip install -e ".[dev]"

      - name: Run unit tests
        run: python -m pytest tests/unit/ -v --tb=short

      - name: Run linter
        run: python -m ruff check .

      - name: Check formatting
        run: python -m ruff format --check .

  # ════════════════════════════════════════════════════════════════════
  # Job 2: Build and push Docker image
  # Runs only on push to main (not on PRs).
  # ════════════════════════════════════════════════════════════════════
  build-push:
    name: Build and push Docker image
    runs-on: ubuntu-latest
    needs: test
    if: github.event_name == 'push' && github.ref == 'refs/heads/main' || github.event_name == 'workflow_dispatch'

    outputs:
      # Pass the image tag to the next job so it can update the manifests repo
      image_tag: ${{ steps.set-tag.outputs.tag }}
      image_full: ${{ steps.set-tag.outputs.full }}

    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Set image tag
        id: set-tag
        run: |
          # Use manual override if provided, otherwise use short git SHA
          if [ -n "${{ github.event.inputs.image_tag }}" ]; then
            TAG="${{ github.event.inputs.image_tag }}"
          else
            TAG="${{ github.sha }}"
            TAG="${TAG:0:7}"
          fi
          echo "tag=${TAG}" >> "$GITHUB_OUTPUT"
          echo "full=${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:${TAG}" >> "$GITHUB_OUTPUT"
          echo "Image tag: ${TAG}"

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build and push Solver-MCP-mcp image
        uses: docker/build-push-action@v5
        with:
          context: .
          file: docker/mcp_server/Dockerfile
          push: true
          tags: |
            ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:${{ steps.set-tag.outputs.tag }}
            ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:latest
          # Cache layers in GitHub Actions cache
          cache-from: type=gha
          cache-to: type=gha,mode=max
          # Pass build time labels for traceability
          labels: |
            org.opencontainers.image.revision=${{ github.sha }}
            org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}

  # ════════════════════════════════════════════════════════════════════
  # Job 3: Update K8s manifests repo
  # Checks out the separate manifests repo, updates the image tag in
  # the relevant deployment file, commits, and pushes. ArgoCD watches
  # that repo and triggers a rollout automatically.
  # ════════════════════════════════════════════════════════════════════
  update-manifests:
    name: Update K8s manifests repo
    runs-on: ubuntu-latest
    needs: build-push

    permissions:
      contents: read

    steps:
      - name: Checkout K8s manifests repo
        uses: actions/checkout@v4
        with:
          # This is the SEPARATE manifests repository, not this repo.
          # Set FEM_AGENT_K8S_REPO in repository secrets.
          # Format: owner/repo-name  e.g. your-org/Solver-MCP-k8s
          repository: ${{ secrets.FEM_AGENT_K8S_REPO }}
          # Personal access token with write access to the manifests repo.
          # Set FEM_AGENT_K8S_TOKEN in repository secrets.
          token: ${{ secrets.FEM_AGENT_K8S_TOKEN }}
          path: k8s-repo

      - name: Update image tag in deployment manifest
        run: |
          cd k8s-repo

          IMAGE_FULL="${{ needs.build-push.outputs.image_full }}"
          IMAGE_TAG="${{ needs.build-push.outputs.image_tag }}"

          echo "Updating image to: ${IMAGE_FULL}"

          # Update the image tag in the MCP server deployment manifest.
          # The manifest uses a placeholder comment # {"image": "Solver-MCP-mcp"}
          # on the line containing the image field, which is how we target
          # the right line without coupling to line numbers.
          sed -i "s|image: .*Solver-MCP-mcp.*|image: ${IMAGE_FULL}|g" \
            deployments/Solver-MCP-mcp/deployment.yaml

          echo "Updated deployment.yaml:"
          grep "image:" deployments/Solver-MCP-mcp/deployment.yaml

      - name: Commit and push manifest update
        run: |
          cd k8s-repo

          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

          git add deployments/Solver-MCP-mcp/deployment.yaml

          # Only commit if there is a real change
          if git diff --cached --quiet; then
            echo "No changes to commit — image tag was already up to date."
          else
            git commit -m "chore: update Solver-MCP-mcp image to ${{ needs.build-push.outputs.image_tag }}

            Source commit: ${{ github.sha }}
            Workflow run:  ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}"
            git push
            echo "Manifest updated and pushed."
          fi
