{# chat.html — conversational simulation view. Hidden until a solver is picked.
   Self-contained styles. Messages + inline result cards are built by app.js. #}
<style>
  #state-chat {
    display: none; /* shown as flex by app.js */
    flex-direction: column;
    height: 100%;
    min-height: 0;
  }

  /* ── Header ──────────────────────────────────────────────── */
  .chat-header {
    flex: 0 0 auto;
    height: 52px;
    border-bottom: 1px solid var(--border);
    display: flex;
    align-items: center;
    padding: 0 20px;
    gap: 12px;
  }
  .chat-header .chat-solver-icon {
    width: 32px;
    height: 32px;
    border-radius: 50%;
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: 16px;
    flex-shrink: 0;
  }
  #chat-solver-name { font-size: 15px; font-weight: 600; }
  #chat-solver-subtitle {
    font-size: 12px;
    color: var(--text-secondary);
    margin-left: 4px;
  }
  .chat-header-spacer { flex: 1; }
  #btn-back-chat {
    background: none;
    border: none;
    color: var(--text-secondary);
    font-size: 13px;
    cursor: pointer;
    padding: 6px 12px;
    border-radius: var(--radius);
  }
  #btn-back-chat:hover { color: var(--text-primary); background: rgba(255,255,255,0.06); }

  /* ── Conversation area ───────────────────────────────────── */
  /* One scroll area holds the whole conversation AND the composer, so the input
     sits at the bottom of the chats and moves down as the conversation grows —
     it is not a bar fixed to the viewport. */
  .chat-scroll {
    flex: 1;
    min-height: 0;        /* critical: lets this area scroll instead of growing */
    overflow-y: auto;
    scroll-behavior: smooth;
  }
  /* Centred column: messages and composer share the same width and alignment. */
  .chat-col {
    max-width: 760px;
    margin: 0 auto;
    padding: 24px 20px 20px;
    display: flex;
    flex-direction: column;
  }
  #chat-messages {
    display: flex;
    flex-direction: column;
  }

  .msg-avatar {
    width: 32px;
    height: 32px;
    border-radius: 50%;
    background: rgba(79,142,247,0.2);
    color: #4f8ef7;
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: 14px;
    flex-shrink: 0;
  }

  .msg-agent {
    display: flex;
    align-items: flex-start;
    gap: 10px;
    margin-bottom: 16px;
  }
  /* Column holding the sender label above its bubble. */
  .msg-col {
    display: flex;
    flex-direction: column;
    min-width: 0;
  }
  .msg-agent .msg-col { max-width: 85%; }
  .msg-user .msg-col { max-width: 75%; align-items: flex-end; }
  .msg-sender {
    font-size: 11px;
    font-weight: 600;
    color: var(--text-secondary);
    margin-bottom: 4px;
    padding: 0 2px;
  }
  .bubble-agent {
    background: var(--bg-card);
    border: 1px solid var(--border);
    border-radius: 2px 12px 12px 12px;
    padding: 12px 16px;
    max-width: 100%;
    font-size: 14px;
    line-height: 1.6;
    color: var(--text-primary);
    white-space: pre-wrap;
  }

  .msg-user {
    display: flex;
    justify-content: flex-end;
    margin-bottom: 16px;
  }
  .bubble-user {
    background: var(--blue);
    color: #fff;
    border-radius: 12px 12px 2px 12px;
    padding: 10px 14px;
    max-width: 100%;
    font-size: 14px;
    line-height: 1.5;
    white-space: pre-wrap;
  }

  /* ── Tool indicators ─────────────────────────────────────── */
  .msg-tool {
    display: flex;
    align-items: center;
    gap: 6px;
    padding: 3px 0 3px 42px;
    font-size: 12px;
    margin-bottom: 4px;
    font-family: monospace;
    animation: slideIn 0.2s ease;
  }
  .msg-tool.tool-start { color: #4f8ef7; }
  .msg-tool.tool-end { color: #2dd4a0; }
  @keyframes slideIn {
    from { opacity: 0; transform: translateX(-8px); }
    to   { opacity: 1; transform: translateX(0); }
  }

  /* ── Thinking indicator ──────────────────────────────────── */
  .msg-thinking {
    display: none; /* toggled to flex by app.js */
    align-items: flex-start;
    gap: 10px;
    margin-bottom: 16px;
  }
  .thinking-bubble {
    background: var(--bg-card);
    border: 1px solid var(--border);
    border-radius: 2px 12px 12px 12px;
    padding: 14px 16px;
    display: flex;
    align-items: center;
  }
  .thinking-bubble .dot {
    display: inline-block;
    width: 6px;
    height: 6px;
    border-radius: 50%;
    background: var(--text-secondary);
    margin: 0 2px;
    animation: blink 1.4s infinite both;
  }
  .thinking-bubble .dot-1 { animation-delay: 0s; }
  .thinking-bubble .dot-2 { animation-delay: 0.2s; }
  .thinking-bubble .dot-3 { animation-delay: 0.4s; }
  @keyframes blink {
    0%, 80%, 100% { opacity: 0; }
    40% { opacity: 1; }
  }

  /* ── Inline result cards ─────────────────────────────────── */
  .result-card {
    background: #0a0d14;
    border: 1px solid var(--border);
    border-radius: var(--radius);
    padding: 14px;
    margin-top: 12px;
  }
  .result-card .card-header {
    font-size: 11px;
    font-weight: 600;
    letter-spacing: 0.5px;
    margin-bottom: 10px;
    color: var(--green);
  }
  .result-card .card-header-cfd { color: var(--blue); }
  .result-card .card-header-freecad { color: var(--text-secondary); }
  .result-card .card-body-dim {
    font-size: 13px;
    color: var(--text-secondary);
    margin-top: 8px;
    line-height: 1.5;
  }

  .result-card .card-metrics {
    display: flex;
    gap: 16px;
    margin-bottom: 12px;
    flex-wrap: wrap;
  }
  .result-card .metric-inline .mi-label {
    font-size: 10px;
    color: var(--text-secondary);
    display: block;
    margin-bottom: 2px;
  }
  .result-card .metric-inline .mi-value {
    font-size: 18px;
    font-weight: 700;
    color: var(--text-primary);
    font-family: monospace;
  }

  .result-card .sparkline-container {
    height: 52px;
    margin-bottom: 10px;
    border-radius: 4px;
    overflow: hidden;
  }
  .result-card .mini-bar-container {
    height: 40px;
    margin-bottom: 10px;
  }

  .result-card .card-footer {
    font-size: 11px;
    color: var(--text-secondary);
  }
  .result-card .artifact-link {
    color: var(--blue);
    text-decoration: none;
  }
  .result-card .artifact-link:hover { text-decoration: underline; }

  /* ── Composer ────────────────────────────────────────────── */
  /* Flows directly under the last message (the bottom of the chats), not pinned
     to the screen. A little breathing room separates it from the conversation. */
  .chat-input-bar {
    padding-top: 14px;
    margin-top: 8px;
  }
  .chat-input-inner {
    display: flex;
    gap: 10px;
    align-items: flex-end;
  }
  #chat-input {
    flex: 1;
    resize: none;
    overflow: hidden;
    background: var(--bg-card);
    border: 1px solid var(--border);
    border-radius: var(--radius);
    color: var(--text-primary);
    padding: 10px 14px;
    font-size: 14px;
    font-family: inherit;
    line-height: 1.5;
    max-height: 120px;
    transition: border-color 0.15s;
  }
  #chat-input:focus { border-color: var(--blue); outline: none; }
  #btn-send {
    padding: 10px 18px;
    background: var(--blue);
    color: #fff;
    border: none;
    border-radius: var(--radius);
    cursor: pointer;
    font-size: 13px;
    font-weight: 600;
    flex-shrink: 0;
    height: 40px;
    transition: background 0.15s;
  }
  #btn-send:hover { background: #3a7ef0; }
  #btn-send:disabled { background: var(--border); cursor: not-allowed; }
</style>

<section id="state-chat">
  <div class="chat-header">
    <div id="chat-solver-icon" class="chat-solver-icon"></div>
    <span id="chat-solver-name"></span>
    <span id="chat-solver-subtitle"></span>
    <div class="chat-header-spacer"></div>
    <button id="btn-back-chat" type="button">← Overview</button>
  </div>

  <div id="chat-scroll" class="chat-scroll">
    <div class="chat-col">
      <div id="chat-messages">
        <div class="msg-thinking" id="thinking">
          <div class="msg-avatar">⚗</div>
          <div class="thinking-bubble">
            <span class="dot dot-1"></span>
            <span class="dot dot-2"></span>
            <span class="dot dot-3"></span>
          </div>
        </div>
      </div>

      <div class="chat-input-bar">
        <div class="chat-input-inner">
          <textarea id="chat-input" rows="1" placeholder="Describe your simulation..."></textarea>
          <button id="btn-send" type="button">Send ↵</button>
        </div>
      </div>
    </div>
  </div>
</section>
